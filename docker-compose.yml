version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/uploaded_docs:/app/uploaded_docs

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend